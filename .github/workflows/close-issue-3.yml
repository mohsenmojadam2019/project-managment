name: Close Issue 3

on:
  push:
    branches:
      - 'chatgpt/close-issue-3-20260831'
    paths:
      - '.github/workflows/close-issue-3.yml'

permissions:
  contents: write

concurrency:
  group: close-issue-3
  cancel-in-progress: true

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Fix dashboard fallback routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/Http/Controllers/DashboardController.php')
          text = path.read_text(encoding='utf-8')

          finance = r"(elseif \(\$this->sidebarUserPermissions\['view_finance_dashboard'\] == 4\) \{\s*)\$this->activeTab = \$tab \?: '[^']+';\s*\$this->\w+Dashboard\(\);"
          ticket = r"(else if \(\$this->sidebarUserPermissions\['view_ticket_dashboard'\] == 4\) \{\s*)\$this->activeTab = \$tab \?: '[^']+';\s*\$this->\w+Dashboard\(\);"

          text, finance_count = re.subn(finance, r"\1$this->activeTab = $tab ?: 'finance';\n                    $this->financeDashboard();", text, count=1)
          text, ticket_count = re.subn(ticket, r"\1$this->activeTab = $tab ?: 'ticket';\n                    $this->ticketDashboard();", text, count=1)
          if finance_count != 1 or ticket_count != 1:
              raise SystemExit(f'Expected one finance and one ticket fallback, got {finance_count}/{ticket_count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Lint changed PHP
        run: |
          php -l app/Http/Controllers/DashboardController.php
          php -l tests/Feature/QualityRegressionTest.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run focused regression tests
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test tests/Feature/QualityRegressionTest.php tests/Unit/RepositoryHardeningTest.php

      - name: Commit validated controller fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/DashboardController.php
          if git diff --cached --quiet; then
            echo "No controller change needed"
          else
            git commit -m "Fix finance and ticket dashboard permission fallback"
            git push origin HEAD:chatgpt/close-issue-3-20260831
          fi
