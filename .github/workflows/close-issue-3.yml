name: Close Issue 3

on:
  push:
    branches:
      - 'chatgpt/close-issue-3-20260831'
    paths:
      - '.github/workflows/close-issue-3.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Fix dashboard fallback routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Http/Controllers/DashboardController.php')
          text = path.read_text(encoding='utf-8')
          text = text.replace("$this->activeTab = $tab ?: 'finance';\n                    $this->ticketDashboard();", "$this->activeTab = $tab ?: 'finance';\n                    $this->financeDashboard();", 1)
          text = text.replace("$this->activeTab = $tab ?: 'finance';\n                    $this->financeDashboard();", "$this->activeTab = $tab ?: 'ticket';\n                    $this->ticketDashboard();", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Lint changed PHP
        run: |
          php -l app/Http/Controllers/DashboardController.php
          php -l tests/Feature/QualityRegressionTest.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run focused regression tests
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test tests/Feature/QualityRegressionTest.php tests/Unit/RepositoryHardeningTest.php

      - name: Commit validated controller fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/DashboardController.php
          git commit -m "Fix finance and ticket dashboard permission fallback"
          git push origin HEAD:chatgpt/close-issue-3-20260831
