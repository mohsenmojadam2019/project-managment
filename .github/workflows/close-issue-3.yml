name: Close Issue 3

on:
  push:
    branches:
      - 'chatgpt/close-issue-3-20260831'
    paths:
      - '.github/workflows/close-issue-3.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Fix dashboard fallback routing and add regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('app/Http/Controllers/DashboardController.php')
          text = controller.read_text(encoding='utf-8')
          old = """                elseif ($this->sidebarUserPermissions['view_finance_dashboard'] == 4) {
                    $this->activeTab = $tab ?: 'finance';
                    $this->ticketDashboard();

                }
                else if ($this->sidebarUserPermissions['view_ticket_dashboard'] == 4) {
                    $this->activeTab = $tab ?: 'finance';
                    $this->financeDashboard();
                }
"""
          new = """                elseif ($this->sidebarUserPermissions['view_finance_dashboard'] == 4) {
                    $this->activeTab = $tab ?: 'finance';
                    $this->financeDashboard();

                }
                else if ($this->sidebarUserPermissions['view_ticket_dashboard'] == 4) {
                    $this->activeTab = $tab ?: 'ticket';
                    $this->ticketDashboard();
                }
"""
          if old not in text:
              raise SystemExit('Expected dashboard fallback block not found')
          controller.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/Feature/QualityRegressionTest.php')
          test.write_text(r'''<?php

namespace Tests\Feature;

use Tests\TestCase;

class QualityRegressionTest extends TestCase
{
    public function test_dashboard_and_date_filter_routes_require_authentication(): void
    {
        $this->get('/account/dashboard')->assertRedirect();
        $this->get('/account/dashboard-advanced?tab=finance')->assertRedirect();
        $this->post('/account/dashboard/week-timelog', ['date' => '2026-08-31'])->assertRedirect();
        $this->get('/account/dashboard/private_calendar?start=2026-08-01&end=2026-08-31')->assertRedirect();
    }

    public function test_invoice_mutations_require_authentication_and_are_not_get_routes(): void
    {
        $this->post('/account/invoices/delete-image', ['id' => 1])->assertRedirect();
        $this->post('/account/invoices/update-status/1')->assertRedirect();

        $routes = file_get_contents(base_path('routes/web.php'));
        $this->assertStringNotContainsString("Route::get('invoices/delete-image'", $routes);
        $this->assertStringNotContainsString("Route::get('invoices/update-status/{invoiceID}'", $routes);
        $this->assertStringContainsString("Route::post('invoices/delete-image'", $routes);
        $this->assertStringContainsString("Route::post('invoices/update-status/{invoiceID}'", $routes);
    }

    public function test_core_role_and_permission_mutations_require_authentication(): void
    {
        $this->post('/account/user-permissions/customPermissions/1')->assertRedirect();
        $this->post('/account/user-permissions/resetPermissions/1')->assertRedirect();
        $this->get('/account/employees')->assertRedirect();
    }

    public function test_dashboard_permission_fallbacks_are_not_swapped(): void
    {
        $controller = file_get_contents(app_path('Http/Controllers/DashboardController.php'));

        $this->assertMatchesRegularExpression(
            "/view_finance_dashboard'\] == 4\).*?activeTab = \\$tab \?: 'finance';.*?financeDashboard\(\);/s",
            $controller
        );
        $this->assertMatchesRegularExpression(
            "/view_ticket_dashboard'\] == 4\).*?activeTab = \\$tab \?: 'ticket';.*?ticketDashboard\(\);/s",
            $controller
        );
    }
}
''', encoding='utf-8')
          PY

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Lint changed PHP
        shell: bash
        run: |
          php -l app/Http/Controllers/DashboardController.php
          php -l tests/Feature/QualityRegressionTest.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run focused regression tests
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test tests/Feature/QualityRegressionTest.php tests/Unit/RepositoryHardeningTest.php

      - name: Commit validated code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/DashboardController.php tests/Feature/QualityRegressionTest.php
          git commit -m "Complete issue 3 regression coverage and dashboard routing fix"
          git push origin HEAD:chatgpt/close-issue-3-20260831
