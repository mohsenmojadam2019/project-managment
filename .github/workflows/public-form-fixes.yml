name: Apply public form fixes

on:
  push:
    branches:
      - chatgpt/audit-fixes-light-dashboard
    paths:
      - '.github/workflows/public-form-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/audit-fixes-light-dashboard
      - name: Apply patch
        run: python3 .github/scripts/public_form_fixes.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        run: php -l app/Http/Controllers/HomeController.php
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Http/Controllers/HomeController.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'harden public lead and ticket flows'
          git push origin HEAD:chatgpt/audit-fixes-light-dashboard
