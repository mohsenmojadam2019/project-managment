name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: PHP syntax check
        shell: bash
        run: |
          find app database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
