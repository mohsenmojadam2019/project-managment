name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer security audit
        continue-on-error: true
        run: composer audit --locked --no-dev

      - name: Unit tests
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --testsuite=Unit

      - name: Focused feature regressions
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test tests/Feature/QualityRegressionTest.php

      - name: PHP syntax check
        shell: bash
        run: |
          find app database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -P 8 -n1 php -l
