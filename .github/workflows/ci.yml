name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP syntax, Composer validation and security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app routes config database tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction
