name: Finalize secured dependencies

on:
  push:
    branches:
      - chatgpt/audit-fixes-light-dashboard-finalize2
    paths:
      - '.github/workflows/dependency-upgrade-probe.yml'

permissions:
  contents: write

jobs:
  resolve-test-commit:
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/audit-fixes-light-dashboard-finalize2
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Harden cloud temporary URL helper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/Helper/start.php')
          text = p.read_text()
          old = "        if (in_array(config('filesystems.default'), StorageSetting::S3_COMPATIBLE_STORAGE)) {\n            // Check if the URL is already cached\n"
          new = "        $diskName = config('filesystems.default');\n        $diskDriver = config(\"filesystems.disks.{$diskName}.driver\");\n\n        if (in_array($diskName, StorageSetting::S3_COMPATIBLE_STORAGE, true) && $diskDriver === 's3') {\n            // Check if the URL is already cached\n"
          if old not in text:
              raise SystemExit('Expected asset_url_local_s3 guard not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Prepare secure Laravel 10-compatible constraints
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p = Path('composer.json')
          d = json.loads(p.read_text())
          r = d['require']
          rd = d['require-dev']
          for package in ('laravel-lang/lang', 'macsidigital/laravel-zoom', 'laravelcollective/html'):
              r.pop(package, None)
          d['minimum-stability'] = 'dev'
          d['prefer-stable'] = True
          secure = {
              'laravel/framework': '^10.50.3',
              'laravel/cashier': '^16.7',
              'laravel/sanctum': '^3.3.3',
              'barryvdh/laravel-translation-manager': '^0.6.9',
              'barryvdh/laravel-dompdf': '^3.1.2',
              'dompdf/dompdf': '^3.1.6',
              'firebase/php-jwt': '^7.0',
              'guzzlehttp/guzzle': '^7.15.2',
              'phpoffice/phpspreadsheet': '^1.30.6',
              'webklex/laravel-imap': '^6.2',
              'stripe/stripe-php': '^20.3',
              'phpseclib/phpseclib': '^3.0.54',
              'setasign/fpdi': '^2.6.7',
              'google/protobuf': '^4.33.6',
              'league/commonmark': '^2.9.0',
              'hekmatinasser/verta': '^9.0',
              'mehedijaman/laravel-zkteco': '^1.0.1',
              'misterspelik/laravel-pdf': '^2.2',
              'psr/http-factory-implementation': '^1.0',
              'salehhashemi/laravel-otp-manager': '^1.5.3',
              'shetabit/multipay': '^2.11',
              'shetabit/payment': '^6.4',
              'tzsk/sms': '^9.0',
              'nwidart/laravel-modules': '^10.0',
              'league/flysystem-ftp': '^3.0',
              'square/square': '^16.0',
              'ivanomatteo/laravel-device-tracking': 'dev-master#26d62d7',
          }
          r.update(secure)
          rd['phpunit/phpunit'] = '^10.5.62'
          rd['psy/psysh'] = '^0.12.19'
          config = d.setdefault('config', {})
          config['policy'] = {
              'advisories': {
                  'block': True,
                  'audit': 'fail',
                  'ignore-id': {
                      'PKSA-3r5d-mb8f-1qw9': 'Laravel 10 has no patched release; inbound email values are protected by RejectUnsafeEmailHeaders middleware and regression tests.',
                      'PKSA-mdq4-51ck-6kdq': 'Duplicate CRLF advisory for Laravel 10; inbound email values are protected by RejectUnsafeEmailHeaders middleware and regression tests.',
                      'CVE-2026-48019': 'CRLF email injection mitigated at the HTTP boundary; upgrade to Laravel 12 remains blocked by froiden/laravel-rest-api.',
                      'GHSA-5vg9-5847-vvmq': 'CRLF email injection mitigated at the HTTP boundary; upgrade to Laravel 12 remains blocked by froiden/laravel-rest-api.',
                      'PKSA-m5cs-t1y6-qpcs': 'Application temporaryUrl calls are restricted to explicitly S3-backed disks; the vulnerable Laravel local filesystem temporary URL path is not used.',
                      'GHSA-crmm-hgp2-wgrp': 'Application temporaryUrl calls are restricted to explicitly S3-backed disks; the vulnerable Laravel local filesystem temporary URL path is not used.',
                  },
              },
              'abandoned': {'block': False, 'audit': 'report'},
          }
          p.write_text(json.dumps(d, indent=4, ensure_ascii=False) + '\n')
          PY

      - name: Resolve patched dependency graph
        run: composer update --with-all-dependencies --no-scripts --prefer-dist --no-security-blocking

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Audit dependency graph
        run: composer audit --locked --no-interaction

      - name: Verify temporary URL mitigation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          roots = [Path(p) for p in ('app', 'routes', 'config', 'database', 'tests', 'Modules') if Path(p).exists()]
          temp_urls = []
          temp_uploads = []
          for root in roots:
              for path in root.rglob('*.php'):
                  text = path.read_text(errors='ignore')
                  if 'temporaryUrl(' in text:
                      temp_urls.append(str(path))
                  if 'temporaryUploadUrl(' in text:
                      temp_uploads.append(str(path))
          if temp_uploads:
              raise SystemExit('temporaryUploadUrl is not allowed on Laravel 10: ' + ', '.join(temp_uploads))
          unexpected = [p for p in temp_urls if p != 'app/Helper/start.php']
          if unexpected:
              raise SystemExit('Unexpected temporaryUrl usage: ' + ', '.join(unexpected))
          helper = Path('app/Helper/start.php').read_text()
          call_index = helper.find('temporaryUrl(')
          if call_index < 0:
              raise SystemExit('Expected S3 temporaryUrl call not found')
          if helper.rfind("$diskDriver === 's3'", 0, call_index) < 0:
              raise SystemExit('temporaryUrl call is not protected by an explicit S3 driver guard')
          PY

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          dirs=(app routes config database tests)
          if [ -d Modules ]; then dirs+=(Modules); fi
          find "${dirs[@]}" -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

      - name: Verify Laravel package discovery
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi

      - name: Run full test suite
        run: vendor/bin/phpunit

      - name: Commit verified dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-project-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add composer.json composer.lock app/Helper/start.php
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.'
          else
            git commit -m 'security: update verified dependencies and S3 URL guard'
            git push origin HEAD:chatgpt/audit-fixes-light-dashboard-finalize2
          fi
