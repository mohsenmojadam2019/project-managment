name: Dependency security upgrade probe

on:
  push:
    branches:
      - chatgpt/audit-fixes-light-dashboard
    paths:
      - '.github/workflows/dependency-upgrade-probe.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_NO_AUDIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/audit-fixes-light-dashboard

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Prepare patched Laravel 10-compatible constraints
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          p = Path('composer.json')
          d = json.loads(p.read_text())
          r = d['require']
          rd = d['require-dev']

          # Remove malware-listed, abandoned-unused and security-blocking legacy packages.
          for package in (
              'laravel-lang/lang',
              'macsidigital/laravel-zoom',
              'laravelcollective/html',
          ):
              r.pop(package, None)

          # Keep dev minimum only because ivanomatteo/laravel-device-tracking is explicitly dev-master.
          d['minimum-stability'] = 'dev'
          d['prefer-stable'] = True

          # Stay on the application's supported Laravel major, but move to the newest 10.x line.
          r['laravel/framework'] = '^10.50.3'
          r['laravel/cashier'] = '^16.7'
          r['laravel/sanctum'] = '^3.3.3'
          r['barryvdh/laravel-translation-manager'] = '^0.6.9'
          r['barryvdh/laravel-dompdf'] = '^3.1.2'
          r['dompdf/dompdf'] = '^3.1.6'
          r['firebase/php-jwt'] = '^7.0'
          r['guzzlehttp/guzzle'] = '^7.15.2'
          r['phpoffice/phpspreadsheet'] = '^1.30.6'
          r['webklex/laravel-imap'] = '^6.2'
          r['stripe/stripe-php'] = '^20.3'
          r['phpseclib/phpseclib'] = '^3.0.54'
          r['setasign/fpdi'] = '^2.6.7'
          r['google/protobuf'] = '^4.33.6'
          r['league/commonmark'] = '^2.9.0'

          rd['phpunit/phpunit'] = '^10.5.62'
          rd['psy/psysh'] = '^0.12.19'

          p.write_text(json.dumps(d, indent=4, ensure_ascii=False) + '\n')
          PY

      - name: Resolve fresh patched dependency graph
        run: composer update --with-all-dependencies --no-scripts --no-interaction --prefer-dist --no-security-blocking

      - name: Validate resolved Composer files
        run: composer validate --no-check-publish

      - name: Audit resolved graph
        run: composer audit --locked --no-interaction
